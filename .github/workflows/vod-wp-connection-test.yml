name: VOD WordPress 接続テスト

# vod_release CPT への接続をセットアップ検証用に確認する手動実行ワークフロー。
# vod-calendar.yml（本番パイプライン）と同じ環境変数・同じ認証方式を使うため、
# ここが通れば vod_publish の WP 投稿部分も通る。
#
# 実行内容:
#   1. 環境変数の有無を確認（値は出力しない）
#   2. CPT が REST API に露出しているか（GET）
#   3. Application Password で投稿できるか（POST → テスト投稿は自動削除）

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: news_bot/requirements.txt

      - name: Install dependencies
        run: pip install -r news_bot/requirements.txt

      - name: Check WordPress connection
        env:
          VOD_NEWS_WP_API_BASE: ${{ secrets.VOD_NEWS_WP_API_BASE }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          VOD_NEWS_CPT_SLUG: ${{ secrets.VOD_NEWS_CPT_SLUG }}
          VOD_NEWS_WP_STATUS: ${{ secrets.VOD_NEWS_WP_STATUS }}
        run: python -m news_bot.check_wp_connection
