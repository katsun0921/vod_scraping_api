name: Dependabot auto-merge

# Dependabot の PR を、テスト（test.yml）が通りパッチ・マイナー更新なら自動でマージする（共通ワークフロー）。
# vod_bot / utils に影響する更新なら、マージ後に Cloud Run へのデプロイ（deploy.yml）を起動する。
# news_bot だけの更新は deploy.yml の paths-ignore と同じ考え方でデプロイしない。

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    uses: ./.github/workflows/test.yml

  # 処理は共通の再利用可能ワークフロー（katsun0921/katsumascore-workflows）にあり、コミットSHAで固定して呼ぶ。
  # パッチ・マイナー更新だけをマージし、メジャー更新と種類が不明な更新は手動でマージする。
  auto-merge:
    needs: test
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    # マージとブランチの削除に要る権限の上限。
    permissions:
      contents: write
      pull-requests: write
    uses: katsun0921/katsumascore-workflows/.github/workflows/dependabot-auto-merge.yml@d0479eeea12a4fdd6580337fc508a5909db5c659
    with:
      # vod_bot / utils に影響する更新だけ、Cloud Run へのデプロイが要る（deploy.yml の paths-ignore と同じ考え方）。
      deploy-paths: '^(vod_bot|utils)/'

  # マージ後、vod_bot / utils の更新なら Cloud Run へデプロイする（GITHUB_TOKEN によるマージでは push の deploy.yml が起動しないため）。
  deploy:
    needs: auto-merge
    if: needs.auto-merge.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Cloud Run へデプロイ
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main --repo "$GITHUB_REPOSITORY"
