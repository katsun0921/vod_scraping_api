name: Theater Calendar

on:
  # 毎月1日 07:00 JST に theater_publish を実行し、その月（1日〜末日）に公開される作品の
  # 月次まとめを下書き投稿する（theater_calendar.month_range()）。
  #
  # GitHub Actions のcronはUTCで「L（月末）」も使えないため、JSTの毎月1日 07:00
  # （＝UTCの前月末日 22:00）を直接指定できない。そこで 28〜31日の 22:00 UTC に起動し、
  # 下の guard ステップで「JSTで今日が1日か」を判定して1日以外はスキップする。
  #
  # 収集（ルーティン）は隔週で「翌月分」を集めてPRを出す（theater_calendar.next_month_range()）。
  # 1つの月は前月中に2回前後収集され、2回目以降は重複キーで弾かれて新規判明分だけが
  # 追加される。前月中に「承認待ち」→「承認済み」にした行だけが1日のまとめに載る。
  #
  # theater_discover（AI Web検索）のcronは外した。Claudeのルーティンが隔週で調査して
  # PRを作る方式へ移行し、従量課金のAPI呼び出しをサブスクリプション内に収めたため
  # （docs/feature/routine-discovery.md）。取り込みは routine-import.yml が担当する。
  # theater_discover はルーティンが止まった場合のフォールバックとして手動実行のみ残す。
  schedule:
    - cron: "0 22 28-31 * *"
  workflow_dispatch:
    inputs:
      command:
        description: "実行するサブコマンド"
        required: false
        # 既定はpublish。discoverはAI APIの従量課金が発生するため明示的に選ばせる
        # （通常はルーティンが担当。docs/feature/routine-discovery.md）
        default: "theater_publish"
        type: choice
        options:
          - "theater_discover"
          - "theater_publish"
      target_month:
        description: "CPT作成対象月 YYYY-MM（空欄は実行日の当月）"
        required: false
        type: string

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      # cronは28〜31日に起動するので、JSTで毎月1日のときだけ後続を実行する。
      # 手動実行（workflow_dispatch）は日付に関係なく実行する。
      - name: Guard first day of month (JST)
        id: guard
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ] && [ "$(TZ=Asia/Tokyo date +%d)" != "01" ]; then
            echo "JSTで毎月1日ではないためスキップします（$(TZ=Asia/Tokyo date +%F)）"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.guard.outputs.run == 'true'
        uses: actions/checkout@v7

      - name: Set up Python
        if: steps.guard.outputs.run == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: news_bot/requirements.txt

      - name: Install dependencies
        if: steps.guard.outputs.run == 'true'
        run: pip install -r news_bot/requirements.txt

      # theater_discover: AI Web検索（Claude/OpenAI併用）で翌月の劇場公開作品を発見し、
      #   「劇場公開予定」シートに投稿状態="承認待ち"で保存する。新規保存分は Slack に
      #   親メッセージ+作品ごとのスレッド返信で確認依頼を通知する。
      #   人間がシートを確認・修正・承認（投稿状態="承認済み"）するまで下流には流れない。
      # theater_publish: 承認済み行から当月分の月次まとめを生成し、theater_release CPT へ下書き投稿。
      #   X スレッド案・Facebook等向けテキスト・注目作の個別投稿案を Slack へ送る（投稿は手動）。
      # （旧: 「劇場情報源」シート巡回の `theater` コマンド。レイヤー1データソース
      #  撤回によりシート未登録のため、cronからは外した。手動実行は引き続き可能）
      - name: Run theater calendar pipeline
        if: steps.guard.outputs.run == 'true'
        env:
          # workflow_dispatchはinputsのcommandを使う。cronはpublishの1本だけなので
          # scheduleで起動した場合は常にtheater_publish。
          COMMAND: ${{ github.event.inputs.command || 'theater_publish' }}
          GOOGLE_SHEETS_SPREADSHEET_ID: ${{ secrets.GOOGLE_SHEETS_SPREADSHEET_ID }}
          GOOGLE_SHEETS_CREDENTIALS_JSON: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS_JSON }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          WP_API_URL: ${{ secrets.WP_API_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          # 劇場公開情報CPT。未設定でもコード側の既定値 theater_release が使われる
          THEATER_NEWS_CPT_SLUG: ${{ secrets.THEATER_NEWS_CPT_SLUG }}
          THEATER_NEWS_WP_STATUS: ${{ secrets.THEATER_NEWS_WP_STATUS }}
          SLACK_BOT_TOKEN: ${{ secrets.NEWS_BOT_SLACK_BOT_TOKEN }}
          SLACK_APPROVAL_CHANNEL_ID: ${{ secrets.NEWS_BOT_SLACK_APPROVAL_CHANNEL_ID }}
          # 劇場公開通知の専用チャンネル。未設定(空)の場合は上の承認チャンネルに送る
          SLACK_THEATER_CHANNEL_ID: ${{ secrets.NEWS_BOT_SLACK_THEATER_CHANNEL_ID }}
          TARGET_MONTH: ${{ github.event.inputs.target_month }}
        run: |
          args=("$COMMAND")
          if [ "$COMMAND" = "theater_publish" ] && [ -n "$TARGET_MONTH" ]; then
            args+=("$TARGET_MONTH")
          fi
          python -m news_bot.main "${args[@]}"
