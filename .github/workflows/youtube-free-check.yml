name: Daily YouTube Free Streaming Check

on:
  schedule:
    # 毎日 06:00 JST（前日 21:00 UTC）に実行
    # 無料公開は数日で終わることがあるため、週次パッチとは別に日次で回す
    - cron: "0 21 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "dry-run（判定のみ、更新・Slack通知なし）"
        type: boolean
        required: false
        default: false
      probe:
        description: "診断モード（判定に使ったシグナルを出力。WordPress・Slackとも触らない）"
        type: boolean
        required: false
        default: false
      url:
        description: "診断するYouTube URLを直接指定（probeを自動で有効化。記事が無い動画も試せる）"
        required: false
        default: ""
      slug:
        description: "特定 slug のみ処理（空欄で全件）"
        required: false
        default: ""
      post_id:
        description: "特定 post ID のみ処理（空欄で全件、slug より優先）"
        required: false
        default: ""
      limit:
        description: "最大処理件数（空欄で全件）"
        required: false
        default: ""

jobs:
  youtube-free-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      PYTHONPATH: ".."
    defaults:
      run:
        working-directory: vod_bot

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # YouTube の watch ページは requests で取得できるため Playwright は入れない

      - name: Run YouTube free streaming check
        env:
          WP_API_URL: ${{ secrets.WP_API_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          WP_BASIC_USER: ${{ secrets.WP_BASIC_USER }}
          WP_BASIC_PASSWORD: ${{ secrets.WP_BASIC_PASSWORD }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          # workflow_dispatch の入力は run: に直接展開せず、環境変数を経由させる。
          # ${{ }} はシェルがパースする前に置換されるため、引用符で囲っても
          # 入力値から抜け出してコマンドを差し込めてしまう
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_PROBE: ${{ inputs.probe }}
          INPUT_URL: ${{ inputs.url }}
          INPUT_SLUG: ${{ inputs.slug }}
          INPUT_POST_ID: ${{ inputs.post_id }}
          INPUT_LIMIT: ${{ inputs.limit }}
        run: |
          ARGS=()
          if [ "$INPUT_DRY_RUN" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          if [ "$INPUT_PROBE" = "true" ]; then
            ARGS+=(--probe)
          fi
          if [ -n "$INPUT_URL" ]; then
            ARGS+=(--url "$INPUT_URL")
          fi
          if [ -n "$INPUT_SLUG" ]; then
            ARGS+=(--slug "$INPUT_SLUG")
          fi
          if [ -n "$INPUT_POST_ID" ]; then
            ARGS+=(--post-id "$INPUT_POST_ID")
          fi
          if [ -n "$INPUT_LIMIT" ]; then
            ARGS+=(--limit "$INPUT_LIMIT")
          fi
          python youtube_free_patch.py "${ARGS[@]}"
