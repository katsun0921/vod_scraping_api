name: VOD公式Xアカウント ハンドル確認

# 「VOD情報源」シートへ登録する前に、候補ハンドルの実在をX APIで確認する
# （仕様書15.#7）。x.com をブラウザで開く方法は存在しないハンドルでも200が
# 返るため実在確認には使えない。
#
# コスト: User read $0.010/件。候補6サービス分でも $0.1 未満の一度きりの費用。

on:
  workflow_dispatch:
    inputs:
      handles:
        description: "確認するハンドル（空白区切り。空なら既定の候補リスト）"
        required: false
        default: ""
        type: string

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: news_bot/requirements.txt

      - name: Install dependencies
        run: pip install -r news_bot/requirements.txt

      - name: Verify X handles
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          HANDLES: ${{ github.event.inputs.handles }}
        run: python -m news_bot.verify_x_handles $HANDLES
