name: VOD Calendar

on:
  # 0 22 * * 0 (UTC) = 毎週月曜 07:00 JST
  # 月曜=vod_publish（承認済み行から週次まとめ生成+WP投稿+Slack通知、仕様書5.）
  #
  # vod_discover（AI Web検索）のcronは外した。Claudeのルーティンが週次で調査して
  # PRを作る方式へ移行し、従量課金のAPI呼び出しをサブスクリプション内に収めたため
  # （docs/feature/routine-discovery.md）。取り込みは routine-import.yml が担当し、
  # X公式アカウントからの抽出（X API v2の認証が必要でルーティンでは代替不可）も
  # そちらで実行する。vod_discover はフォールバックとして手動実行のみ残す。
  schedule:
    - cron: "0 22 * * 0"
  workflow_dispatch:
    inputs:
      command:
        description: "実行するサブコマンド"
        required: false
        # 既定はpublish。discoverはAI APIの従量課金が発生するため明示的に選ばせる
        # （通常はルーティンが担当。docs/feature/routine-discovery.md）
        default: "vod_publish"
        type: choice
        options:
          - "vod_discover"
          - "vod_publish"

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: news_bot/requirements.txt

      - name: Install dependencies
        run: pip install -r news_bot/requirements.txt

      - name: Run VOD calendar pipeline
        env:
          # workflow_dispatchはinputsのcommandを使う。cronはpublishの1本だけなので
          # scheduleで起動した場合は常にvod_publish。
          COMMAND: ${{ github.event.inputs.command || 'vod_publish' }}
          GOOGLE_SHEETS_SPREADSHEET_ID: ${{ secrets.GOOGLE_SHEETS_SPREADSHEET_ID }}
          GOOGLE_SHEETS_CREDENTIALS_JSON: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS_JSON }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          WP_API_URL: ${{ secrets.WP_API_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          VOD_NEWS_CPT_SLUG: ${{ secrets.VOD_NEWS_CPT_SLUG }}
          VOD_NEWS_WP_STATUS: ${{ secrets.VOD_NEWS_WP_STATUS }}
          SLACK_BOT_TOKEN: ${{ secrets.NEWS_BOT_SLACK_BOT_TOKEN }}
          SLACK_APPROVAL_CHANNEL_ID: ${{ secrets.NEWS_BOT_SLACK_APPROVAL_CHANNEL_ID }}
          # VOD配信情報通知の専用チャンネル。未設定(空)の場合は上の承認チャンネルに送る
          SLACK_VOD_CHANNEL_ID: ${{ secrets.NEWS_BOT_SLACK_VOD_CHANNEL_ID }}
        run: python -m news_bot.main "$COMMAND"
