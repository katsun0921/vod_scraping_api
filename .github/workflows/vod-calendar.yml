name: VOD Calendar

on:
  # 毎月1日 07:00 JST に vod_publish を実行し、その月（1日〜末日）に配信開始される作品の
  # 月次まとめを下書き投稿する（vod_calendar.month_range()、仕様書5.）。
  #
  # cronはUTCで「L（月末）」も使えないため、28〜31日の 22:00 UTC に起動し、
  # guard ステップで「JSTで今日が1日か」を判定して1日以外はスキップする
  # （theater-calendar.yml と同じ方式）。
  #
  # vod_discover（AI Web検索）のcronは外した。Claudeのルーティンが隔週で翌月分を調査して
  # PRを作る方式へ移行し、従量課金のAPI呼び出しをサブスクリプション内に収めたため
  # （docs/feature/routine-discovery.md）。取り込みは routine-import.yml が担当し、
  # X公式アカウントからの抽出（X API v2の認証が必要でルーティンでは代替不可）も
  # そちらで実行する。vod_discover はフォールバックとして手動実行のみ残す。
  schedule:
    - cron: "0 22 28-31 * *"
  workflow_dispatch:
    inputs:
      command:
        description: "実行するサブコマンド"
        required: false
        # 既定はpublish。discoverはAI APIの従量課金が発生するため明示的に選ばせる
        # （通常はルーティンが担当。docs/feature/routine-discovery.md）
        default: "vod_publish"
        type: choice
        options:
          - "vod_discover"
          - "vod_publish"
      target_month:
        description: "CPT作成対象月 YYYY-MM（空欄は実行日の当月）"
        required: false
        type: string

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      # cronは28〜31日に起動するので、JSTで毎月1日のときだけ後続を実行する。
      # 手動実行（workflow_dispatch）は日付に関係なく実行する。
      - name: Guard first day of month (JST)
        id: guard
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ] && [ "$(TZ=Asia/Tokyo date +%d)" != "01" ]; then
            echo "JSTで毎月1日ではないためスキップします（$(TZ=Asia/Tokyo date +%F)）"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.guard.outputs.run == 'true'
        uses: actions/checkout@v7

      - name: Set up Python
        if: steps.guard.outputs.run == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: news_bot/requirements.txt

      - name: Install dependencies
        if: steps.guard.outputs.run == 'true'
        run: pip install -r news_bot/requirements.txt

      - name: Run VOD calendar pipeline
        if: steps.guard.outputs.run == 'true'
        env:
          # workflow_dispatchはinputsのcommandを使う。cronはpublishの1本だけなので
          # scheduleで起動した場合は常にvod_publish。
          COMMAND: ${{ github.event.inputs.command || 'vod_publish' }}
          GOOGLE_SHEETS_SPREADSHEET_ID: ${{ secrets.GOOGLE_SHEETS_SPREADSHEET_ID }}
          GOOGLE_SHEETS_CREDENTIALS_JSON: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS_JSON }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          WP_API_URL: ${{ secrets.WP_API_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          VOD_NEWS_CPT_SLUG: ${{ secrets.VOD_NEWS_CPT_SLUG }}
          VOD_NEWS_WP_STATUS: ${{ secrets.VOD_NEWS_WP_STATUS }}
          SLACK_BOT_TOKEN: ${{ secrets.NEWS_BOT_SLACK_BOT_TOKEN }}
          SLACK_APPROVAL_CHANNEL_ID: ${{ secrets.NEWS_BOT_SLACK_APPROVAL_CHANNEL_ID }}
          # VOD配信情報通知の専用チャンネル。未設定(空)の場合は上の承認チャンネルに送る
          SLACK_VOD_CHANNEL_ID: ${{ secrets.NEWS_BOT_SLACK_VOD_CHANNEL_ID }}
          TARGET_MONTH: ${{ github.event.inputs.target_month }}
        run: |
          args=("$COMMAND")
          if [ "$COMMAND" = "vod_publish" ] && [ -n "$TARGET_MONTH" ]; then
            args+=("$TARGET_MONTH")
          fi
          python -m news_bot.main "${args[@]}"
