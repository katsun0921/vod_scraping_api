name: Routine Data Auto Merge

# ルーティンが作成した成果物PRは、人間のPRレビューを挟まず自動で取り込む。
# pull_request_targetを使うのは、PRをマージできるGITHUB_TOKENをbase側のWorkflowから
# 発行するため。PR側のコードは実行せず、変更範囲をAPIで検証してからJSONだけを読む。
on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - "news_bot/routine_data/*.json"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: routine-data-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate-and-merge:
    # forkからのPRや、通常の開発ブランチをwrite権限で扱わない。
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (startsWith(github.head_ref, 'routine/theater-') ||
       startsWith(github.head_ref, 'routine/vod-'))
    runs-on: ubuntu-latest

    steps:
      - name: Verify changed files
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          changed_files=$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" \
            --jq '.[] | [.status, .filename] | @tsv')

          if [ -z "$changed_files" ]; then
            echo "変更ファイルがありません"
            exit 1
          fi

          while IFS=$'\t' read -r status filename; do
            if [[ ! "$filename" =~ ^news_bot/routine_data/[^/]+\.json$ ]]; then
              echo "自動マージ対象外の変更です: $filename"
              exit 1
            fi
            if [ "$status" != "added" ] && [ "$status" != "modified" ]; then
              echo "追加・更新以外の変更は自動マージしません: $status $filename"
              exit 1
            fi
            echo "自動マージ対象: $status $filename"
          done <<< "$changed_files"

      - name: Checkout validated PR revision
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Validate routine JSON
        run: |
          set -euo pipefail
          while IFS= read -r -d '' filename; do
            python -m json.tool "$filename" > /dev/null
            jq -e 'type == "array" and all(.[]; type == "object")' "$filename" > /dev/null
            echo "JSON検証OK: $filename"
          done < <(find news_bot/routine_data -maxdepth 1 -type f -name '*.json' -print0)

      - name: Squash merge validated revision
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          gh api --method PUT \
            "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/merge" \
            -f sha="$HEAD_SHA" \
            -f merge_method="squash" \
            --jq 'if .merged then .message else error(.message) end'
