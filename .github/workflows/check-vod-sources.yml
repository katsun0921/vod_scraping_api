name: VOD情報源シート 読み取り確認

# 「VOD情報源」シートへCSVをimportした直後に実行し、vod_discover が実際に使う
# sheets.get_active_vod_x_accounts() がシートを想定どおり読めているかを確認する。
#
# X API も Claude API も呼ばないため課金は発生せず、シートへの書き込みも行わない
# （読み取りのみ）。vod_discover を実行する前の安全な事前確認。

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: news_bot/requirements.txt

      - name: Install dependencies
        run: pip install -r news_bot/requirements.txt

      - name: Check VOD sources sheet
        env:
          GOOGLE_SHEETS_SPREADSHEET_ID: ${{ secrets.GOOGLE_SHEETS_SPREADSHEET_ID }}
          GOOGLE_SHEETS_CREDENTIALS_JSON: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS_JSON }}
        run: python -m news_bot.check_vod_sources
