name: Routine PR Notify

on:
  pull_request:
    types:
      - opened
    paths:
      - "news_bot/routine_data/theater_latest.json"
      - "news_bot/routine_data/vod_latest.json"

permissions:
  contents: read

jobs:
  notify:
    if: >-
      startsWith(github.head_ref, 'routine/theater-') ||
      startsWith(github.head_ref, 'routine/vod-')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Notify Slack
        env:
          SLACK_BOT_TOKEN: ${{ secrets.NEWS_BOT_SLACK_BOT_TOKEN }}
          SLACK_APPROVAL_CHANNEL_ID: ${{ secrets.NEWS_BOT_SLACK_APPROVAL_CHANNEL_ID }}
          SLACK_THEATER_CHANNEL_ID: ${{ secrets.NEWS_BOT_SLACK_THEATER_CHANNEL_ID }}
          SLACK_VOD_CHANNEL_ID: ${{ secrets.NEWS_BOT_SLACK_VOD_CHANNEL_ID }}
        run: python -m news_bot.routine_pr_notify "$GITHUB_EVENT_PATH"
